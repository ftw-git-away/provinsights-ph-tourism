```yaml
name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "chore/**"
      - "docs/**"
      - "ci/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a # v5.0.0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install SQL parser
        run: |
          python -m pip install --upgrade pip
          python -m pip install sqlglot

      - name: Check required files and directories
        shell: bash
        run: |
          failed=false

          for path in README.md docs notebooks resources src tests; do
            if [[ ! -e "$path" ]]; then
              echo "ERROR: Required path '$path' is missing"
              failed=true
            else
              echo "PASS: $path exists"
            fi
          done

          if [[ ! -s README.md ]]; then
            echo "ERROR: README.md is empty"
            failed=true
          fi

          if [[ "$failed" == true ]]; then
            exit 1
          fi

      - name: Check Python syntax in src/
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys

          root = Path("src")

          files = sorted(root.rglob("*.py")) if root.is_dir() else []

          if not files:
              print("INFO: No Python files found in src/; skipped")
              sys.exit(0)

          failed = False

          for path in files:
              try:
                  source = path.read_text(encoding="utf-8")
                  compile(source, str(path), "exec")
                  print(f"PASS: {path}")

              except (OSError, UnicodeDecodeError, SyntaxError) as exc:
                  print(f"ERROR: {path}: {exc}")
                  failed = True

          if failed:
              sys.exit(1)
          PY

      - name: Check notebooks directory contents
        shell: bash
        run: |
          failed=false

          while IFS= read -r -d '' path; do
            relative="${path#notebooks/}"
            filename="$(basename "$path")"

            if [[ "$relative" == "README.md" ]]; then
              continue
            fi

            if [[ "$filename" != *.ipynb ]]; then
              echo "ERROR: notebooks/ may only contain .ipynb files and README.md: $relative"
              failed=true
            fi
          done < <(find notebooks -type f -print0)

          if [[ "$failed" == true ]]; then
            exit 1
          fi

      - name: Validate notebook structure and cell syntax
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          import sys
          import ast
          from pathlib import Path

          import sqlglot
          from sqlglot import errors as sqlglot_errors

          root = Path("notebooks")
          files = sorted(root.rglob("*.ipynb")) if root.is_dir() else []

          if not files:
              print("INFO: No .ipynb notebooks found; skipped")
              sys.exit(0)

          valid_cell_types = {"code", "markdown", "raw"}
          failed = False

          def cell_source(cell):
              source = cell.get("source", "")

              if isinstance(source, str):
                  return source

              if isinstance(source, list) and all(
                  isinstance(line, str) for line in source
              ):
                  return "".join(source)

              raise ValueError("cell has invalid source")

          def detect_magic(source):
              lines = source.splitlines()

              for line in lines:
                  stripped = line.strip()

                  if not stripped:
                      continue

                  match = re.match(r"^%(python|sql|md)\b", stripped, re.IGNORECASE)

                  if match:
                      return match.group(1).lower()

                  # Databricks notebooks can also use language-specific cells
                  # where the magic appears as the first non-empty line.
                  return None

              return None

          def remove_magic(source, magic):
              lines = source.splitlines()

              for index, line in enumerate(lines):
                  if line.strip():
                      lines = lines[index + 1:]
                      break

              return "\n".join(lines)

          for path in files:
              try:
                  with path.open(encoding="utf-8") as file:
                      notebook = json.load(file)

                  if not isinstance(notebook, dict):
                      raise ValueError("notebook must be a JSON object")

                  cells = notebook.get("cells")

                  if not isinstance(cells, list):
                      raise ValueError("'cells' must be a list")

                  has_markdown = False

                  for index, cell in enumerate(cells, start=1):
                      if not isinstance(cell, dict):
                          raise ValueError(
                              f"cell {index} must be an object"
                          )

                      cell_type = cell.get("cell_type")

                      if cell_type not in valid_cell_types:
                          raise ValueError(
                              f"cell {index} has invalid cell_type: {cell_type}"
                          )

                      source = cell_source(cell)

                      if cell_type == "markdown":
                          has_markdown = True
                          continue

                      if cell_type != "code":
                          continue

                      magic = detect_magic(source)

                      if magic == "md":
                          has_markdown = True
                          continue

                      if magic == "python":
                          python_source = remove_magic(source, magic)

                          try:
                              ast.parse(
                                  python_source,
                                  filename=f"{path}:cell-{index}",
                              )
                          except SyntaxError as exc:
                              raise ValueError(
                                  f"cell {index} has invalid Python syntax: {exc}"
                              ) from exc

                          print(f"PASS: {path} cell {index} Python")

                      elif magic == "sql":
                          sql_source = remove_magic(source, magic).strip()

                          if not sql_source:
                              raise ValueError(
                                  f"cell {index} contains %sql but no SQL"
                              )

                          try:
                              sqlglot.parse(
                                  sql_source,
                                  read="databricks",
                              )
                          except sqlglot_errors.ParseError as exc:
                              raise ValueError(
                                  f"cell {index} has invalid Databricks SQL syntax: {exc}"
                              ) from exc

                          print(f"PASS: {path} cell {index} SQL")

                      else:
                          print(
                              f"INFO: {path} cell {index} has no recognized "
                              "language magic; syntax check skipped"
                          )

                  if not has_markdown:
                      raise ValueError(
                          "notebook must contain at least one markdown cell"
                      )

                  print(f"PASS: {path}")

              except (
                  OSError,
                  UnicodeDecodeError,
                  json.JSONDecodeError,
                  ValueError,
              ) as exc:
                  print(f"ERROR: Invalid notebook {path}: {exc}")
                  failed = True

          if failed:
              sys.exit(1)
          PY
```
