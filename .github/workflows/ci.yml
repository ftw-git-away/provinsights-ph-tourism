name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "chore/**"
      - "docs/**"
      - "ci/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a # v5.0.0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check required files and directories
        shell: bash
        run: |
          failed=false

          for path in \
            README.md \
            docs \
            notebooks \
            resources \
            src \
            tests
          do
            if [[ ! -e "$path" ]]; then
              echo "ERROR: Required path '$path' is missing"
              failed=true
            else
              echo "PASS: $path exists"
            fi
          done

          if [[ ! -s README.md ]]; then
            echo "ERROR: README.md is empty"
            failed=true
          fi

          if [[ "$failed" == true ]]; then
            exit 1
          fi

      - name: Check Python syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys

          roots = [Path("src"), Path("tests")]
          files = sorted(
              path
              for root in roots
              if root.is_dir()
              for path in root.rglob("*.py")
          )

          if not files:
              print("INFO: No Python files found in src/ or tests/; skipped")
              sys.exit(0)

          failed = False

          for path in files:
              try:
                  source = path.read_text(encoding="utf-8")
                  compile(source, str(path), "exec")
                  print(f"PASS: {path}")
              except (OSError, UnicodeDecodeError, SyntaxError) as exc:
                  print(f"ERROR: {path}: {exc}")
                  failed = True

          if failed:
              sys.exit(1)
          PY

      - name: Validate notebook JSON structure
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import sys

          root = Path("notebooks")
          files = sorted(root.rglob("*.ipynb")) if root.is_dir() else []

          if not files:
              print("INFO: No .ipynb notebooks found; skipped")
              sys.exit(0)

          valid_types = {"code", "markdown", "raw"}
          failed = False

          for path in files:
              try:
                  with path.open(encoding="utf-8") as file:
                      notebook = json.load(file)

                  if not isinstance(notebook, dict):
                      raise ValueError("notebook must be a JSON object")

                  cells = notebook.get("cells")
                  if not isinstance(cells, list):
                      raise ValueError("'cells' must be a list")

                  for index, cell in enumerate(cells, start=1):
                      if not isinstance(cell, dict):
                          raise ValueError(f"cell {index} must be an object")

                      if cell.get("cell_type") not in valid_types:
                          raise ValueError(f"cell {index} has an invalid cell_type")

                      source = cell.get("source")
                      if not (
                          isinstance(source, str)
                          or (
                              isinstance(source, list)
                              and all(isinstance(line, str) for line in source)
                          )
                      ):
                          raise ValueError(f"cell {index} has invalid source")

                  print(f"PASS: {path}")

              except (OSError, UnicodeDecodeError, json.JSONDecodeError, ValueError) as exc:
                  print(f"ERROR: {path}: {exc}")
                  failed = True

          if failed:
              sys.exit(1)
          PY

