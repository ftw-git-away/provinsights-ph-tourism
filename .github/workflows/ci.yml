name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "chore/**"
      - "docs/**"
      - "fix/**"
      - "test/**"
      - "ci/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tests/requirements.txt

      - name: Check required files and directories
        shell: bash
        run: |
          failed=false

          for path in README.md docs notebooks resources tests; do
            if [[ ! -e "$path" ]]; then
              echo "ERROR: Required path '$path' is missing"
              failed=true
            else
              echo "PASS: $path exists"
            fi
          done

          if [[ ! -s README.md ]]; then
            echo "ERROR: README.md is empty"
            failed=true
          fi

          if [[ "$failed" == true ]]; then
            exit 1
          fi

      - name: Check notebooks directory contents
        shell: bash
        run: |
          failed=false

          while IFS= read -r -d '' path; do
            relative="${path#notebooks/}"
            filename="$(basename "$path")"

            # README.md is allowed in notebooks/ and in each layer folder
            if [[ "$filename" == "README.md" ]]; then
              continue
            fi

            if [[ "$filename" != *.ipynb ]]; then
              echo "ERROR: notebooks/ may only contain .ipynb files and README.md: $relative"
              failed=true
            fi
          done < <(find notebooks -type f -print0)

          if [[ "$failed" == true ]]; then
            exit 1
          fi

      - name: Run unit tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover \
            --start-directory tests/unit \
            --top-level-directory tests/unit \
            --pattern "test_*.py" \
            --verbose

  # Checks databricks.yml and resources/jobs/*.yml against the files in this branch,
  # so a renamed or missing notebook is caught on the PR instead of after merge.
  #
  # Uses the separate "ci-validate" GitHub environment, NOT "development":
  # pull requests from branches in this repo can change this workflow, so the
  # token here must be a low-privilege, validate-only token. The deploy token
  # stays in "development", which is restricted to the main branch.
  # Skipped for PRs from forks, which cannot read environment secrets.
  bundle-validate:
    name: Validate Databricks bundle
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    environment:
      name: ci-validate

    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      BUNDLE_VAR_alert_email: ${{ vars.DATABRICKS_ALERT_EMAIL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Check required GitHub configuration
        shell: bash
        run: |
          if [ -z "${DATABRICKS_HOST:-}" ]; then
            echo "Missing GitHub environment variable: DATABRICKS_HOST (Settings -> Environments -> ci-validate)"
            exit 1
          fi

          if [ -z "${DATABRICKS_TOKEN:-}" ]; then
            echo "Missing GitHub environment secret: DATABRICKS_TOKEN (Settings -> Environments -> ci-validate)"
            exit 1
          fi

          if [ -z "${BUNDLE_VAR_alert_email:-}" ]; then
            echo "Missing GitHub environment variable: DATABRICKS_ALERT_EMAIL (Settings -> Environments -> ci-validate)"
            exit 1
          fi

          echo "PASS: Databricks configuration found"

      - name: Install Databricks CLI
        uses: databricks/setup-cli@8821c27b1fe57472264eeb6e50c1f31d69552f28
        with:
          version: 1.19.0

      - name: Validate bundle
        run: databricks bundle validate -t dev
