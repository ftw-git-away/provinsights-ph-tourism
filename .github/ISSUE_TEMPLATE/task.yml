name: Project task
description: Define an outcome, owner, dependencies, and acceptance evidence.
title: "[TASK] "
body:
  - type: markdown
    attributes:
      value: |
        Keep each issue small enough to review. Assign one accountable owner and a different reviewer when possible. Link issues that block this work.
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: What should be true when this issue is complete?
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Why this matters
      description: Which project goal, source decision, or deliverable does it support?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      value: |
        Included:
        -

        Not included:
        -
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and parallel work
      description: What blocks completion? What can begin before those blockers are cleared?
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria and evidence
      value: |
        - [ ] Deliverable is complete
        - [ ] Evidence or validation result is linked
        - [ ] Relevant documentation is updated, or reason is given
    validations:
      required: true
  - type: input
    id: owner
    attributes:
      label: Accountable owner
      placeholder: "@github-handle"
    validations:
      required: true
  - type: input
    id: reviewer
    attributes:
      label: Reviewer
      placeholder: "@github-handle"
    validations:
      required: true
