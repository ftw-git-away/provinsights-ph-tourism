# resources/jobs/tourism_pipeline.yml
#
# PURPOSE
#   Defines the Databricks job that runs the Tuklas Pinas pipeline.
#   Run order: setup -> ingestion -> bronze -> silver -> gold -> analytics -> data quality
#   Each layer is followed by a validation task, so problems stop the run
#   close to where they started (see tests/README.md).
#
# ADDING A TASK FOR A NEW NOTEBOOK
#   1. Merge your notebook into main first. Do not add its task before then.
#   2. Find the commented block for your layer below.
#   3. Remove the "#" at the start of each line in that block.
#   4. Replace <file name> with your notebook's exact file name.
#   5. Set depends_on to the task(s) your notebook reads from.
#   6. Open a small PR containing only this change.
#
# RULES
#   - Keep a block commented until its notebook exists on main.
#     A task that points to a missing notebook will fail the deploy.
#   - Write paths relative to this file (resources/jobs/).
#     Always start them with ../../ to reach the repo root.
#   - Use one task per notebook, and give each a unique task_key.
#   - Give every task a timeout_seconds. Add retries only to tasks that call
#     external sources (PSA, DOT, Google Drive), where failures are often temporary.
#
# CHECK BEFORE OPENING A PR
#   databricks bundle validate -t dev

resources:
  jobs:
    tourism_pipeline:
      name: ProvInsights - End-to-End Pipeline
      description: >-
        Runs setup, source ingestion, Bronze, Silver, Gold, analytics and the
        consolidated data-quality gate for the Tuklas Pinas tourism and local
        economy platform, in dependency order.

      max_concurrent_runs: 1   # never let two runs write the same tables at once
      timeout_seconds: 7200    # stop the whole run after 2 hours

      notification_settings:
        no_alert_for_skipped_runs: true
        no_alert_for_canceled_runs: true

      # Failure emails (planned). First add an alert_email variable to
      # databricks.yml and a BUNDLE_VAR_alert_email value to deploy.yml.
      # email_notifications:
      #   on_failure:
      #     - ${var.alert_email}

      tasks:

        # ---------- 01 Setup (active) ----------
        - task_key: ingestion_setup
          timeout_seconds: 600
          notebook_task:
            notebook_path: ../../notebooks/01-ingestion/00_ingestion_setup.ipynb

        # ---------- 01 Ingestion (active; notebooks must be moved into notebooks/01-ingestion) ----------
        - task_key: ingest_psa
          timeout_seconds: 900
          max_retries: 2
          min_retry_interval_millis: 30000
          retry_on_timeout: true
          depends_on:
            - task_key: ingestion_setup
          notebook_task:
            notebook_path: ../../notebooks/01-ingestion/01_ingest_psa.ipynb

        - task_key: ingest_psgc
          timeout_seconds: 900
          max_retries: 2
          min_retry_interval_millis: 30000
          retry_on_timeout: true
          depends_on:
            - task_key: ingestion_setup
          notebook_task:
            notebook_path: ../../notebooks/01-ingestion/02_ingest_psgc.ipynb

        - task_key: ingest_dot
          timeout_seconds: 900
          max_retries: 2
          min_retry_interval_millis: 30000
          retry_on_timeout: true
          depends_on:
            - task_key: ingestion_setup
          notebook_task:
            notebook_path: ../../notebooks/01-ingestion/03_ingest_dot.ipynb

        # ---------- 02 Bronze (planned) ----------
